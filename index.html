    <!-- Structured Data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is NRO outward remittance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "NRO outward remittance is the legal process of transferring money from your NRO (Non-Resident Ordinary) bank account in India to your overseas bank account. REPAIHUB prepares the paperwork for you — Form 145 (formerly 15CA) and Form 146 (formerly 15CB), certified by a partner Chartered Accountant — and the transfer is executed by a regulated Indian partner bank."
          }
        },
        {
          "@type": "Question",
          "name": "Is REPAIHUB regulated?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. REPAIHUB Remittance Inc. is registered with FINTRAC as a Money Services Business (MSB), registration number N300002485. The site is a beta preview: live transfers start once our Indian partner bank agreement is in place. Transfers will be executed by a regulated Indian partner bank under FEMA rules."
          }
        },
        {
          "@type": "Question",
          "name": "How long does a transfer take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our target is 1–2 business days after your documents are accepted. Exact timing depends on your Indian bank and our partner bank."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to visit a branch in India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The service is designed so you do not need to visit a branch in India: identity verification, the compliance forms and the transfer request are done online. Some banks may still contact you to confirm a request."
          }
        },
        {
          "@type": "Question",
          "name": "What is the annual limit for NRO remittance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Under FEMA, NRIs can repatriate up to USD 1 million per financial year from NRO balances, after applicable taxes and with Form 145/146 where required. REPAIHUB tracks your usage and alerts you as you approach the limit."
          }
        }
      ]
    }
    </script>
